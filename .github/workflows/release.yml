name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          manifest=$(node scripts/changelog-version.mjs manifest)
          if [ "$version" != "$manifest" ]; then
            echo "::error title=Release::Tag $TAG does not match the manifest version $manifest"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; nothing to do."
            exit 0
          fi
          node scripts/changelog-version.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "model-escalator $version" --notes-file "$RUNNER_TEMP/notes.md"
