name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Single source for the pinned engine version.
  CLAUDE_CODE_VERSION: 2.1.295

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: the mods API is in early access and can change between releases.
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }} typescript@5.6.3
      - run: claude plugin validate .
      - run: claude plugin test .
      - name: Test the repository scripts
        working-directory: .
        run: node --test scripts/*.test.mjs
      - name: Type check against the published mod API types
        run: |
          mkdir -p .claude-plugin/types
          curl -fsSL -o .claude-plugin/types/claude-code.d.ts \
            https://raw.githubusercontent.com/anthropics/claude-code/main/mods/types/claude-code.d.ts
          # The published types are written by a specific Claude Code release.
          types_version=$(head -n 1 .claude-plugin/types/claude-code.d.ts \
            | sed -nE 's#^// Written by Claude Code ([0-9]+\.[0-9]+\.[0-9]+)\.?[[:space:]]*$#\1#p')
          if [ -z "$types_version" ]; then
            echo "::error title=Type check::Cannot read the version from the first line of the published types"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$types_version" "$CLAUDE_CODE_VERSION" | sort -V | tail -n 1)
          if [ "$newest" = "$types_version" ]; then
            tsc -p .
          else
            echo "::warning title=Type check skipped::Published types are at $types_version, older than the pinned engine $CLAUDE_CODE_VERSION. The type check runs locally against the engine's own types."
          fi
